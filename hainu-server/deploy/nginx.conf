# 海大工坊 Nginx 配置示例（IP:端口 部署，无域名）
# 部署路径：/etc/nginx/sites-available/hainu-workshop → sites-enabled 软链

server {
    listen 80;
    server_name 159.75.116.207 _;
    client_max_body_size 8m;

    # API 反代到 Node 服务
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传文件静态访问（反代到 Node）
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # 管理后台静态资源 — JS/CSS 不缓存（避免更新后浏览器用旧缓存）
    location /admin/assets/ {
        alias /var/www/hainu-workshop/admin-dist/assets/;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location /admin/ {
        alias /var/www/hainu-workshop/admin-dist/;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /admin/index.html;
    }

    # 网页端（Vue3 静态，根路径）
    location / {
        alias /var/www/hainu-workshop/web-dist/;
        try_files $uri $uri/ /index.html;
    }
}
